services:
  postgres:
    image: postgres:16-alpine
    container_name: pks_kr1-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pks_kr1
      POSTGRES_USER: pks_kr1
      POSTGRES_PASSWORD: pks_kr1
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pks_kr1 -d pks_kr1"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: